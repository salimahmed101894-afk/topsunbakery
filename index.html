<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top Sun Bakery — የቢዝነስ ሲስተም v2.1</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f7f3ea,#141210);--card:light-dark(#fff,#211e1a);--text:light-dark(#251f19,#f6efe5);--muted:light-dark(#75695d,#bdb2a6);--line:light-dark(#e6ddd1,#3b342e);--accent:light-dark(#9b6516,#e0a23b);--good:#2f8f57;--bad:#c34c4c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Ethiopic",sans-serif}header{padding:18px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}h1{font-size:21px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:72px;z-index:4}.tabs button{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--text);padding:9px 12px;border-radius:9px}.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}main{max-width:1100px;margin:auto;padding:14px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px}.kpi{font-size:23px;font-weight:700;margin-top:6px}.muted{color:var(--muted);font-size:12px}label{display:block;font-size:13px;margin:8px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}button{cursor:pointer}.primary,.secondary,.danger{border:0;border-radius:8px;padding:10px 13px;margin-top:9px}.primary{background:var(--accent);color:#fff}.secondary{background:var(--line);color:var(--text)}.danger{background:var(--bad);color:#fff}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.tablewrap{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--muted)}.ok{color:var(--good);font-weight:700}.warn{color:var(--bad);font-weight:700}.sectiontitle{margin:4px 0 10px;font-size:17px}.notice{padding:10px;border-radius:9px;background:light-dark(#fff7e7,#302619);border:1px solid var(--line);margin:10px 0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--line);font-size:12px;margin:2px}.total{font-weight:700}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:12px}.print{float:right}.rolebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.rolebar select{width:auto;min-width:150px;padding:7px}.locked{opacity:.55;pointer-events:none}.loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}.loginCard{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 30px #0002}.loginCard h2{margin-top:0}.appHidden{display:none!important}.loginError{color:var(--bad);font-size:13px;margin-top:8px}@media(max-width:600px){header{position:relative}.tabs{top:0}.kpi{font-size:20px}}
</style></head>
<body>
<div id="loginScreen" class="loginScreen">
  <div class="loginCard">
    <h2>☀️ TOP SUN BAKERY</h2>
    <div class="sub">የሰራተኛ Login</div>
    <label>Username</label><input id="loginUser" autocomplete="username" placeholder="Username">
    <label>Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Password">
    <button class="primary" style="width:100%" onclick="doLogin()">ግባ</button>
    <div id="loginError" class="loginError"></div>
    <div class="notice small">ይህ አሁን የPrototype Login ነው። የእውነተኛ Server/Database ላይ የሚሰራ Login በሚቀጥለው የOnline ስሪት ይዘጋጃል።</div>
    <div class="small muted">Demo: owner / 1234</div>
  </div>
</div>
<div id="app" class="appHidden">
<header><h1>☀️ TOP SUN BAKERY</h1><div class="sub">የምርት • ስቶክ • ሽያጭ • ወጪ • ቅርንጫፍ • ብድር • ትርፍ/ኪሳራ</div><div class="rolebar"><span class="small">የገባ ተጠቃሚ፦</span><select id="activeRole" onchange="setRole(this.value)"><option>Owner</option><option>Manager</option><option>Cashier</option><option>Production</option><option>Branch Counter</option></select><span id="roleHint" class="small"></span><button class="secondary" onclick="logout()">ውጣ</button></div></header>
<nav class="tabs">
<button class="active" data-tab="dash">ዳሽቦርድ</button><button data-tab="main">ዋና ቤት</button><button data-tab="branch">ቅርንጫፍ</button><button data-tab="production">ምርት/ስቶክ</button><button data-tab="sales">ሽያጭ</button><button data-tab="expenses">ወጪ</button><button data-tab="borrow">ብድር/እቃ</button><button data-tab="closing">🔒 የቀን መዝጊያ</button><button data-tab="reports">ሪፖርት</button><button data-tab="users">ተጠቃሚዎች</button>
</nav>
<main>
<section id="dash" class="page active"></section>
<section id="main" class="page"></section>
<section id="branch" class="page"></section>
<section id="production" class="page"></section>
<section id="sales" class="page"></section>
<section id="expenses" class="page"></section>
<section id="borrow" class="page"></section>
<section id="closing" class="page"></section>
<section id="reports" class="page"></section>
<section id="users" class="page"></section>
</main>
</div>
<script>
const key='topsun_v2';let db=JSON.parse(localStorage.getItem(key)||'null')||{products:[
['ዳቦ','small flower',10],['ዳቦ','medium cutter',15],['ዳቦ','zebra sharp cut',20],['ዳቦ','round burger',30],['ዳቦ','round',50],['ኬክ','1kg',800],['ኬክ','2kg',1600],['ኬክ','3kg',2400],['ብስኩት','ብስኩት',30],['ሳምቡሳ','ሳምቡሳ',30],['ፖንፖሊኖ','ፖንፖሊኖ',40],['ዶናት','ዶናት',70],['ዶናት','mini donut',100]],production:[],incoming:[],damaged:[],sales:[],expenses:[],branches:[],returns:[],borrow:[],branchSales:[],closed:[],overnight:[],users:[['Owner','ባለቤት'],['Manager','ማኔጀር'],['Cashier','ካሻሪ'],['Production','ምርት'],['Branch Counter','ቅርንጫፍ ቆጣሪ']]};
function ensureProducts(){const wanted=[['ዳቦ','ትንሽ አበባ',10],['ዳቦ','መካከለኛ ካተር',15],['ዳቦ','ዜብራ ሹርፕ ቁራጭ',20],['ዳቦ','ራውንድ በርገር',30],['ዳቦ','ራውንድ',50],['ኬክ','1 ኪ.ግ',800],['ኬክ','2 ኪ.ግ',1600],['ኬክ','3 ኪ.ግ',2400],['ብስኩት','ብስኩት',30],['ሳምቡሳ','ሳምቡሳ',30],['ፖንፖሊኖ','ፖንፖሊኖ',40],['ዶናት','ዶናት',70],['ዶናት','ሚኒ ዶናት',100]]; if(!Array.isArray(db.products)) db.products=[]; wanted.forEach(w=>{if(!db.products.some(p=>p[0]===w[0]&&p[1]===w[1])) db.products.push(w)}); saveProductsOnly();} function saveProductsOnly(){localStorage.setItem(key,JSON.stringify(db));} ensureProducts();
function save(){localStorage.setItem(key,JSON.stringify(db));renderAll()}
if(!db.branchSales)db.branchSales=[]; if(!db.incoming)db.incoming=[]; if(!db.damaged)db.damaged=[]; if(!db.overnight)db.overnight=[];
const LOCS=['ዋና ቤት','ቅርንጫፍ 1','ቅርንጫፍ 2'];
function overnightId(location){return location==='ዋና ቤት'?'main':location==='ቅርንጫፍ 1'?'branch1':'branch2'}
function overnightCategories(){return ['ዳቦ','ኬክ','ብስኩት','ከውጭ የገባ እቃ'];}
function overnightTotal(date,location){return db.overnight.filter(x=>x.date===date&&x.location===location).reduce((a,x)=>a+(+x.value||0),0)}
function overnightRows(date,location){return db.overnight.filter(x=>x.date===date&&x.location===location).map((x,i)=>`<tr><td>${esc(x.category)}</td><td>${esc(x.name)}</td><td>${x.qty||0}</td><td>${money(x.value)}</td><td><button class=\"danger\" onclick=\"delItem('overnight',${db.overnight.indexOf(x)})\">ሰርዝ</button></td></tr>`).join('')}
function overnightCard(location,date=today()){const prev=new Date(date+'T00:00:00');prev.setDate(prev.getDate()-1);const prevDate=prev.toISOString().slice(0,10);return `<div class=\"card\" style=\"margin-top:10px\"><div class=\"sectiontitle\">🌙 ${location} — አዳር</div><div class=\"notice small\">የትላንት አዳር፦ <b>${money(overnightTotal(prevDate,location))}</b> &nbsp; | &nbsp; የዛሬ አዳር፦ <b>${money(overnightTotal(date,location))}</b></div><div class=\"row\"><div><label>ምድብ</label><select id=\"ovcat_${overnightId(location) }\"><option>ዳቦ</option><option>ኬክ</option><option>ብስኩት</option><option>ከውጭ የገባ እቃ</option><option>አዲስ ምድብ</option></select></div><div><label>አዲስ ስም (ካስፈለገ)</label><input id=\"ovname_${overnightId(location)}\" placeholder=\"ለምሳሌ ወተት / እርጎ / ፊሌቨር\"></div><div><label>ብዛት</label><input id=\"ovqty_${overnightId(location)}\" type=\"number\" min=\"0\"></div><div><label>የአዳር ዋጋ በብር</label><input id=\"ovvalue_${overnightId(location)}\" type=\"number\" min=\"0\"></div></div><div class=\"row\"><div><label>አዲስ ምድብ ስም</label><input id=\"ovnewcat_${overnightId(location)}\" placeholder=\"ለምሳሌ ሌላ ምርት\"></div></div><button class=\"primary\" onclick=\"addOvernight('${location}')\">+ የዛሬ አዳር መዝግብ</button><div class=\"tablewrap\"><table><tr><th>ምድብ</th><th>ስም</th><th>ብዛት</th><th>በብር ዋጋ</th><th></th></tr>${overnightRows(date,location)}<tr><td colspan=\"3\" class=\"total\">የዛሬ አዳር ጠቅላላ</td><td class=\"total\">${money(overnightTotal(date,location))}</td><td></td></tr></table></div></div>`}
function addOvernight(location){if(!can(location==='ዋና ቤት'?'main':'branch')){alert('ፈቃድ የለዎትም።');return}const date=today();if(isClosed(date)){alert('ይህ ቀን ተዘግቷል።');return}const id=overnightId(location);const cat0=document.getElementById('ovcat_'+id).value;const newCat=document.getElementById('ovnewcat_'+id).value.trim();const name=document.getElementById('ovname_'+id).value.trim();const category=cat0==='አዲስ ምድብ'?(newCat||'ሌላ'):cat0;const qty=+document.getElementById('ovqty_'+id).value||0;const value=+document.getElementById('ovvalue_'+id).value||0;if(!name){alert('የእቃውን/ምርቱን ስም ያስገቡ።');return}if(value<0||qty<0){alert('ቁጥሩ ትክክል አይደለም።');return}db.overnight.push({date,location,category,name,qty,value});save()}function today(){return new Date().toISOString().slice(0,10)}function money(n){return (Number(n)||0).toLocaleString()+' ብር'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const rolePerms={Owner:['dash','main','branch','production','sales','expenses','borrow','closing','reports','users'],Manager:['dash','main','branch','production','sales','expenses','borrow','closing','reports'],Cashier:['dash','main','sales'],Production:['dash','production'], 'Branch Counter':['dash','branch']};
const demoAccounts={owner:{password:'1234',role:'Owner',name:'ባለቤት'},manager:{password:'1234',role:'Manager',name:'ማኔጀር'},cashier:{password:'1234',role:'Cashier',name:'ካሻሪ'},production:{password:'1234',role:'Production',name:'ምርት'},branch:{password:'1234',role:'Branch Counter',name:'ቅርንጫፍ ቆጣሪ'}};
function doLogin(){const u=(document.getElementById('loginUser').value||'').trim().toLowerCase();const p=document.getElementById('loginPass').value||'';const a=demoAccounts[u];if(!a||a.password!==p){document.getElementById('loginError').textContent='Username ወይም Password ትክክል አይደለም።';return}localStorage.setItem('topsun_session',JSON.stringify({user:u,role:a.role,name:a.name}));activeRole=a.role;localStorage.setItem('topsun_active_role',activeRole);document.getElementById('loginScreen').classList.add('appHidden');document.getElementById('app').classList.remove('appHidden');applyPermissions();}
function logout(){localStorage.removeItem('topsun_session');document.getElementById('app').classList.add('appHidden');document.getElementById('loginScreen').classList.remove('appHidden');document.getElementById('loginPass').value='';}
function restoreSession(){const s=JSON.parse(localStorage.getItem('topsun_session')||'null');if(s&&demoAccounts[s.user]&&demoAccounts[s.user].role===s.role){activeRole=s.role;document.getElementById('loginScreen').classList.add('appHidden');document.getElementById('app').classList.remove('appHidden');}}

let activeRole=localStorage.getItem('topsun_active_role')||'Owner';
function setRole(role){activeRole=role;localStorage.setItem('topsun_active_role',role);applyPermissions();}
function can(tab){return (rolePerms[activeRole]||[]).includes(tab)}
function applyPermissions(){document.querySelectorAll('.tabs button').forEach(b=>{b.style.display=can(b.dataset.tab)?'':'none'});document.querySelectorAll('.page').forEach(x=>{x.classList.remove('active')});let first=(rolePerms[activeRole]||['dash'])[0];let btn=document.querySelector(`.tabs button[data-tab="${first}"]`);if(btn){btn.classList.add('active');document.getElementById(first).classList.add('active')}const r=document.getElementById('activeRole');if(r)r.value=activeRole;const h=document.getElementById('roleHint');if(h)h.textContent=activeRole==='Owner'?'ሁሉንም መቆጣጠር':activeRole==='Manager'?'ሽያጭ/ምርት/ስቶክ/ሪፖርት':activeRole==='Cashier'?'ሽያጭ እና ክፍያ':activeRole==='Production'?'ምርት እና ስቶክ':'ቅርንጫፍ መላኪያ እና መመለሻ';}
function guard(tab){if(!can(tab)){alert('ይህን ክፍል ለመጠቀም ፈቃድ የለዎትም።');return false}return true}
function nav(){document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(!guard(b.dataset.tab))return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.tab).classList.add('active')})}nav();
function selProducts(){return db.products.map((p,i)=>`<option value="${i}">${esc(p[0])} — ${esc(p[1])} (${p[2]} ብር)</option>`).join('')}
function stock(category,date=today()){
 let opening=openingStock(category,date),produced=0,incoming=0,sold=0,damaged=0,transfer=0,returned=0;
 db.production.filter(x=>x.date===date&&x.category===category).forEach(x=>produced+=+x.qty||0);
 db.incoming.filter(x=>x.date===date&&x.category===category).forEach(x=>incoming+=+x.qty||0);
 db.sales.filter(x=>x.date===date&&x.category===category).forEach(x=>sold+=+x.qty||0);
 db.damaged.filter(x=>x.date===date&&x.category===category).forEach(x=>damaged+=+x.qty||0);
 db.branches.filter(x=>x.date===date&&x.category===category).forEach(x=>transfer+=+x.qty||0);
 db.returns.filter(x=>x.date===date&&x.category===category&&x.toMain!==false).forEach(x=>returned+=+x.qty||0);
 return {opening,produced,incoming,sold,damaged,transfer,returned,ending:opening+produced+incoming+returned-sold-damaged-transfer}
}
function openingStock(category,date){
 let prev=db.closed.filter(x=>x.date<date).sort((a,b)=>a.date.localeCompare(b.date)).slice(-1)[0];
 if(prev&&prev.ending&&prev.ending[category]!=null)return +prev.ending[category]||0;
 let dates=[...new Set([...db.production,...db.sales,...db.branches,...db.returns].map(x=>x.date).filter(d=>d<date))].sort();
 let last=dates[dates.length-1]; return last?Math.max(0,stockRaw(category,last).ending):0;
}
function stockRaw(category,date){
 let dates=[...new Set([...db.production,...db.sales,...db.branches,...db.returns].map(x=>x.date).filter(d=>d<date))].sort(),opening=0;
 let last=dates[dates.length-1]; if(last){let c=db.closed.find(x=>x.date===last);opening=c&&c.ending&&c.ending[category]!=null?+c.ending[category]||0:stockRaw(category,last).ending;}
 let produced=db.production.filter(x=>x.date===date&&x.category===category).reduce((a,x)=>a+(+x.qty||0),0);
 let incoming=db.incoming.filter(x=>x.date===date&&x.category===category).reduce((a,x)=>a+(+x.qty||0),0);
 let sold=db.sales.filter(x=>x.date===date&&x.category===category).reduce((a,x)=>a+(+x.qty||0),0);
 let damaged=db.damaged.filter(x=>x.date===date&&x.category===category).reduce((a,x)=>a+(+x.qty||0),0);
 let transfer=db.branches.filter(x=>x.date===date&&x.category===category).reduce((a,x)=>a+(+x.qty||0),0);
 let returned=db.returns.filter(x=>x.date===date&&x.category===category&&x.toMain!==false).reduce((a,x)=>a+(+x.qty||0),0);
 return {ending:opening+produced+incoming+returned-sold-damaged-transfer};
}
function allStock(date){let result={};['ዳቦ','ኬክ','ብስኩት','ሳምቡሳ','ፖንፖሊኖ','ዶናት'].forEach(c=>result[c]=openingStock(c,date));return result}
function dash(){let d=today(),sales=db.sales.filter(x=>x.date===d),exp=db.expenses.filter(x=>x.date===d);let total=sales.reduce((a,x)=>a+x.qty*x.price,0),ex=exp.reduce((a,x)=>a+x.amount,0);document.getElementById('dash').innerHTML=`<div class="notice"><b>ዛሬ፦ ${d}</b> — መረጃው በዚህ መሣሪያ ውስጥ በbrowser ላይ ይቀመጣል።</div><div class="grid"><div class="card">🛒 ሽያጭ<div class="kpi">${money(total)}</div></div><div class="card">💸 ወጪ<div class="kpi">${money(ex)}</div></div><div class="card">🏦 CBE<div class="kpi">${money(payTotal('CBE',d))}</div></div><div class="card">📱 Telebirr<div class="kpi">${money(payTotal('Telebirr',d))}</div></div><div class="card">💵 Cash<div class="kpi">${money(payTotal('Cash',d))}</div></div><div class="card">🧾 ዱቤ<div class="kpi">${money(payTotal('Credit',d))}</div></div></div><div class="card" style="margin-top:12px"><div class="sectiontitle">የቀን መዝጊያ</div><p class="small">ቀኑን ሲዘጉ የዛሬ ቀሪ እቃ የነገ መነሻ ቀሪ ይሆናል።</p><button class="primary" onclick="closeDay()">🔒 ቀኑን ዝጋ</button> <button class="secondary" onclick="branchMessage()">📩 የቅርንጫፍ ሪፖርት አዘጋጅ</button></div>`}
function payTotal(method,date){return db.sales.filter(x=>x.date===date&&x.payment===method).reduce((a,x)=>a+(+x.received||0),0)+db.branchSales.filter(x=>x.date===date&&x.payment===method).reduce((a,x)=>a+(+x.received||x.qty*x.price),0)}
function mainPage(){let d=today();let rows=['ዳቦ','ኬክ','ብስኩት'].map(c=>{let s=stock(c,d);return `<tr><td>${c}</td><td>${s.opening}</td><td>${s.produced}</td><td>${s.incoming}</td><td>${s.sold}</td><td>${s.damaged}</td><td>${s.transfer}</td><td class="total">${s.ending}</td></tr>`}).join('');let sales=db.sales.filter(x=>x.date===d),salesExpected=sales.reduce((a,x)=>a+x.qty*x.price,0),received=sales.reduce((a,x)=>a+(+x.received||x.qty*x.price),0);let incomingRows=db.incoming.slice(-30).reverse().map((x,i)=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.cost)}</td></tr>`).join('');document.getElementById('main').innerHTML=`<div class="card"><div class="sectiontitle">🏠 ዋና ቤት — የካሻሪ እና ስቶክ ማጠቃለያ</div><div class="row"><div><label>ቀን</label><input id="mainDate" type="date" value="${d}" onchange="mainPage()"></div></div><div class="tablewrap"><table><tr><th>ክፍል</th><th>የትናንት ቀሪ</th><th>ዛሬ የተሰራ</th><th>ከውጭ የገባ</th><th>የተሸጠ</th><th>የተበላሸ</th><th>ወደ ቅርንጫፍ</th><th>የቀረ</th></tr>${rows}</table></div></div><div class="card" style="margin-top:10px"><div class="sectiontitle">➕ አዲስ የሽያጭ እቃ / ምርት — ያልተገደበ</div><div class="row"><div><label>ምድብ</label><input id="newProdCat" placeholder="ወተት / እርጎ / ፊሌቨር / ሌላ"></div><div><label>የእቃ/ምርት ስም</label><input id="newProdName" placeholder="ለምሳሌ ወተት 1 ሊትር"></div><div><label>የሽያጭ ዋጋ (ብር)</label><input id="newProdPrice" type="number" min="0"></div></div><button class="primary" onclick="addCustomProduct()">+ አዲስ ምርት ጨምር</button></div><div class="card" style="margin-top:10px"><div class="sectiontitle">📦 አዲስ እቃ / ከውጭ የገባ — ያልተገደበ ስም</div><div class="row"><div><label>ምድብ</label><input id="incCat" placeholder="ወተት፣ እርጎ፣ ፊሌቨር፣ ወዘተ"></div><div><label>እቃ / ምርት ስም</label><input id="incName" placeholder="ማንኛውንም አዲስ ስም ያስገቡ"></div><div><label>ብዛት</label><input id="incQty" type="number" min="0"></div><div><label>የገዛበት ዋጋ</label><input id="incCost" type="number" min="0"></div></div><button class="primary" onclick="addIncoming()">+ እቃ ጨምር</button><div class="tablewrap"><table><tr><th>ቀን</th><th>ምድብ</th><th>እቃ</th><th>ብዛት</th><th>ዋጋ</th></tr>${incomingRows}</table></div></div><div class="card" style="margin-top:10px"><div class="sectiontitle">⚠️ የተበላሸ / የጠፋ — ያልተገደበ አዲስ ምርት</div><div class="row"><div><label>ምድብ</label><input id="damCat" placeholder="ዳቦ / ኬክ / ወተት / ሌላ..."></div><div><label>ምርት</label><input id="damName" placeholder="ማንኛውም ምርት"></div><div><label>ብዛት</label><input id="damQty" type="number" min="0"></div><div><label>ምክንያት</label><input id="damReason" placeholder="ደረቀ / ተበላሸ / ጠፋ..."></div></div><button class="danger" onclick="addDamaged()">+ ብልሽት መዝግብ</button></div>${overnightCard('ዋና ቤት',d)}<div class="card" style="margin-top:10px"><div class="sectiontitle">💳 የክፍያ መንገድ</div><div class="grid">${['Cash','CBE','Telebirr','Credit'].map(m=>`<div><span class="pill">${m}</span><div class="kpi">${money(payTotal(m,d))}</div></div>`).join('')}</div><div class="notice">የሽያጭ ዋጋ መጠን፦ ${money(salesExpected)} | በካሻሪ የተቀበለ፦ ${money(received)} ${Math.abs(salesExpected-received)<0.01?'<span class="ok">✓ ተመሳሳይ</span>':'<span class="warn">⚠ ልዩነት '+money(received-salesExpected)+'</span>'}</div></div>`}
function addCustomProduct(){if(!can('main')){alert('ፈቃድ የለዎትም።');return}let cat=(document.getElementById('newProdCat')?.value||'').trim()||'ሌላ',name=(document.getElementById('newProdName')?.value||'').trim(),price=+document.getElementById('newProdPrice').value||0;if(!name){alert('የአዲሱን እቃ/ምርት ስም ያስገቡ።');return}if(db.products.some(p=>p[0]===cat&&p[1]===name)){alert('ይህ ምርት አስቀድሞ አለ።');return}db.products.push([cat,name,price]);save()}
function addIncoming(){let __d=today();if(isClosed(__d)){alert('ይህ ቀን ተዘግቷል።');return}let name=document.getElementById('incName').value.trim(),cat=document.getElementById('incCat').value.trim()||'ከውጭ የገባ እቃ',qty=+document.getElementById('incQty').value||0,cost=+document.getElementById('incCost').value||0;if(!name){alert('የእቃውን ስም ያስገቡ።');return}db.incoming.push({date:__d,category:cat,name,qty,cost});save()}
function addDamaged(){let __d=today();if(isClosed(__d)){alert('ይህ ቀን ተዘግቷል።');return}let category=document.getElementById('damCat').value.trim()||'ሌላ',name=document.getElementById('damName').value.trim(),qty=+document.getElementById('damQty').value||0,reason=document.getElementById('damReason').value.trim();if(!name){alert('የተበላሸውን ምርት ስም ያስገቡ።');return}db.damaged.push({date:__d,category,name,qty,reason});save()}
function productionPage(){const ings=getIngredients();document.getElementById('production').innerHTML=`<div class="card"><div class="sectiontitle">🏭 የዛሬ ምርት / ስቶክ ግቤት</div><div class="row"><div><label>ቀን</label><input id="pdate" type="date" value="${today()}"></div><div><label>ክፍል</label><select id="pcat"><option>ዳቦ</option><option>ኬክ</option><option>ብስኩት</option><option>ሳምቡሳ</option><option>ፖንፖሊኖ</option><option>ዶናት</option></select></div><div><label>ምርት</label><select id="pprod">${selProducts()}</select></div><div><label>ብዛት</label><input id="pqty" type="number" min="0"></div></div><button class="primary" onclick="addProduction()">+ ምርት መዝግብ</button><div class="tablewrap"><table><tr><th>ቀን</th><th>ክፍል</th><th>ምርት</th><th>ብዛት</th><th></th></tr>${db.production.slice(-20).reverse().map((x,i)=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td><button class="danger" onclick="delItem('production',${db.production.length-1-i})">ሰርዝ</button></td></tr>`).join('')}</table></div></div><div class="card"><div class="sectiontitle">🧂 የምርት ግብዓት</div><div class="notice small">ዋና ግብዓቶች፦ ዱቄት፣ እርሾ፣ ጨው። አዲስ ግብዓት ማከል ትችላለህ።</div><div class="row"><div><label>ቀን</label><input id="idate" type="date" value="${today()}"></div><div><label>ግብዓት</label><select id="iing">${ings.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div><label>መጠን</label><input id="iqty" type="number" min="0" step="0.001" placeholder="ለምሳሌ 500"></div><div><label>መለኪያ</label><select id="iunit"><option>gram (g)</option><option>kg</option><option>ml</option><option>Litre (L)</option><option>pcs</option></select></div><div><label>ዋጋ / መለኪያ</label><input id="iprice" type="number" min="0" step="0.01" placeholder="ብር"></div></div><div class="row"><div><label>አዲስ ግብዓት</label><input id="newIng" placeholder="ለምሳሌ ዘይት / ስኳር / ወተት"></div><div style="align-self:end"><button class="secondary" onclick="addIngredient()">+ አዲስ ግብዓት ጨምር</button></div></div><button class="primary" onclick="addProductionInput()">+ ግብዓት መዝግብ</button><div class="tablewrap"><table><tr><th>ቀን</th><th>ግብዓት</th><th>መጠን</th><th>መለኪያ</th><th>ዋጋ</th><th>ጠቅላላ ወጪ</th><th></th></tr>${(db.productionInputs||[]).slice(-30).reverse().map((x,i)=>`<tr><td>${x.date}</td><td>${esc(x.ingredient)}</td><td>${x.qty}</td><td>${esc(x.unit)}</td><td>${(+x.price||0).toFixed(2)}</td><td>${((+x.qty||0)*(+x.price||0)).toFixed(2)} ብር</td><td><button class="danger" onclick="delItem('productionInputs',${(db.productionInputs||[]).length-1-i})">ሰርዝ</button></td></tr>`).join('')}</table></div></div>`}
function getIngredients(){return JSON.parse(localStorage.getItem('topsun_ingredients')||'null')||['ዱቄት','እርሾ','ጨው']}
function addIngredient(){if(!can('production')){alert('ፈቃድ የለዎትም።');return} const el=document.getElementById('newIng'),name=(el?.value||'').trim();if(!name){alert('የአዲሱን ግብዓት ስም ያስገቡ።');return} const a=getIngredients();if(!a.includes(name)){a.push(name);localStorage.setItem('topsun_ingredients',JSON.stringify(a))} productionPage();document.getElementById('iing').value=name;}
function addProductionInput(){if(!can('production')){alert('ፈቃድ የለዎትም።');return} let d=document.getElementById('idate').value||today();if(isClosed(d)){alert('ይህ ቀን ተዘግቷል። አዲስ መረጃ መጨመር አይቻልም።');return}let q=+document.getElementById('iqty').value||0;if(q<=0){alert('የግብዓቱን መጠን ያስገቡ።');return}if(!db.productionInputs)db.productionInputs=[];db.productionInputs.push({date:d,ingredient:document.getElementById('iing').value,qty:q,unit:document.getElementById('iunit').value,price:+document.getElementById('iprice').value||0});save()}
function addProduction(){if(!can('production')){alert('ፈቃድ የለዎትም።');return} let __d=(document.getElementById('pdate')?.value)||today(); if(isClosed(__d)){alert('ይህ ቀን ተዘግቷል። አዲስ መረጃ መጨመር አይቻልም።');return} let i=+document.getElementById('pprod').value,p=db.products[i];db.production.push({date:document.getElementById('pdate').value,category:document.getElementById('pcat').value,name:p[1],qty:+document.getElementById('pqty').value||0});save()}

function salesPage(){document.getElementById('sales').innerHTML=`<div class="card"><div class="sectiontitle">🛒 የዋና ቤት ሽያጭ</div><div class="row"><div><label>ቀን</label><input id="sdate" type="date" value="${today()}"></div><div><label>ምርት</label><select id="sprod">${selProducts()}</select></div><div><label>ብዛት</label><input id="sqty" type="number" min="0"></div><div><label>ክፍያ</label><select id="spay"><option>Cash</option><option>CBE</option><option>Telebirr</option><option>Credit</option></select></div><div><label>በእርግጥ የተቀበለው ብር</label><input id="sreceived" type="number" min="0" placeholder="ለዱቤ 0"></div></div><button class="primary" onclick="addSale()">+ ሽያጭ መዝግብ</button><div class="tablewrap"><table><tr><th>ቀን</th><th>ምርት</th><th>ብዛት</th><th>ዋጋ</th><th>የሽያጭ መጠን</th><th>የተቀበለ</th><th>ክፍያ</th><th></th></tr>${db.sales.slice(-30).reverse().map((x,i)=>`<tr><td>${x.date}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td><td>${money(x.received??x.qty*x.price)}</td><td>${x.payment}</td><td><button class="danger" onclick="delItem('sales',${db.sales.length-1-i})">ሰርዝ</button></td></tr>`).join('')}</table></div></div>`}
function addSale(){if(!can('sales')){alert('ፈቃድ የለዎትም።');return} let __d=(document.getElementById('sdate')?.value)||today(); if(isClosed(__d)){alert('ይህ ቀን ተዘግቷል። አዲስ መረጃ መጨመር አይቻልም።');return} let p=db.products[+document.getElementById('sprod').value],qty=+document.getElementById('sqty').value||0,expected=qty*+p[2],pay=document.getElementById('spay').value,received=document.getElementById('sreceived').value===''?(pay==='Credit'?0:expected):+document.getElementById('sreceived').value;if(received<0||received>expected){alert('የተቀበለው ብር ከ0 እስከ የሽያጭ መጠን መሆን አለበት።');return}db.sales.push({date:document.getElementById('sdate').value,name:p[1],category:p[0],qty,price:+p[2],payment:pay,received});save()}
function expensesPage(){document.getElementById('expenses').innerHTML=`<div class="card"><div class="sectiontitle">💸 ወጪ</div><div class="row"><div><label>ቀን</label><input id="edate" type="date" value="${today()}"></div><div><label>የወጪ ስም</label><input id="ename" placeholder="ዱቄት / ኤሌክትሪክ / ደመወዝ..."></div><div><label>የምርት ክፍል</label><select id="ecat"><option value="ጠቅላላ">ጠቅላላ ወጪ</option><option>ዳቦ</option><option>ኬክ</option><option>ብስኩት</option></select></div><div><label>መጠን</label><input id="eamount" type="number"></div></div><button class="primary" onclick="addExpense()">+ ወጪ መዝግብ</button><div class="tablewrap"><table><tr><th>ቀን</th><th>ወጪ</th><th>ብር</th><th></th></tr>${db.expenses.slice(-30).reverse().map((x,i)=>`<tr><td>${x.date}</td><td>${esc(x.name)}</td><td>${money(x.amount)}</td><td><button class="danger" onclick="delItem('expenses',${db.expenses.length-1-i})">ሰርዝ</button></td></tr>`).join('')}</table></div></div>`}
function addExpense(){if(!can('expenses')){alert('ፈቃድ የለዎትም።');return} let __d=(document.getElementById('edate')?.value)||today(); if(isClosed(__d)){alert('ይህ ቀን ተዘግቷል። አዲስ መረጃ መጨመር አይቻልም።');return} db.expenses.push({date:document.getElementById('edate').value,name:document.getElementById('ename').value,category:document.getElementById('ecat')?.value||'ጠቅላላ',amount:+document.getElementById('eamount').value||0});save()}

function closingPage(date=today()){
 const d=date;

 const cats=['ዳቦ','ኬክ','ብስኩት'];
 const st=cats.map(c=>({c,...stock(c,d)}));

 const expenses=db.expenses.filter(x=>x.date===d).reduce((a,x)=>a+x.amount,0);
 const payments={}; ['Cash','CBE','Telebirr','Credit'].forEach(m=>payments[m]=payTotal(m,d));

 <div class="card" style="margin-top:10px"><div class="sectiontitle">💳 የተቀበለ ገንዘብ</div><div class="grid"><div>Cash<div class="kpi">${money(payments.Cash)}</div></div><div>CBE<div class="kpi">${money(payments.CBE)}</div></div><div>Telebirr<div class="kpi">${money(payments.Telebirr)}</div></div><div>ዱቤ<div class="kpi">${money(payments.Credit)}</div></div></div><div class="notice">የተቀበለ ገንዘብ፦ <b>${money(paymentTotal)}</b> | የሽያጭ ድምር፦ <b>${money(totalSales)}</b> ${Math.abs(paymentTotal-totalSales)<0.01?'<span class="ok">✓ ተመሳሳይ</span>':'<span class="warn">⚠ የሚጠበቅ ልዩነት አለ</span>'}</div></div>

function closeSpecificDay(d){if(!can('closing')){alert('የቀን መዝጊያ ፈቃድ የለዎትም።');return} if(isClosed(d)){alert('ይህ ቀን አስቀድሞ ተዘግቷል።');return}const ending={};['ዳቦ','ኬክ','ብስኩት','ሳምቡሳ','ፖንፖሊኖ','ዶናት'].forEach(c=>ending[c]=stock(c,d).ending);const mainSales=db.sales.filter(x=>x.date===d).reduce((a,x)=>a+x.qty*x.price,0),branchSalesAmount=db.branchSales.filter(x=>x.date===d).reduce((a,x)=>a+x.qty*x.price,0),expenses=db.expenses.filter(x=>x.date===d).reduce((a,x)=>a+x.amount,0);const payments={};['Cash','CBE','Telebirr','Credit'].forEach(m=>payments[m]=payTotal(m,d));db.closed.push({date:d,ending,mainSales,branchSales:branchSalesAmount,totalSales:mainSales+branchSalesAmount,expenses,payments,closedAt:new Date().toISOString()});save();closingPage(d);alert('ቀኑ በትክክል ተዘግቷል። የዛሬ ቀሪ እቃ የነገ መነሻ ቀሪ ይሆናል።')}
function copyClosingReport(d){const main=db.sales.filter(x=>x.date===d).reduce((a,x)=>a+x.qty*x.price,0),br=db.branchSales.filter(x=>x.date===d).reduce((a,x)=>a+x.qty*x.price,0),ex=db.expenses.filter(x=>x.date===d).reduce((a,x)=>a+x.amount,0);const ps={};['Cash','CBE','Telebirr','Credit'].forEach(m=>ps[m]=payTotal(m,d));const st=['ዳቦ','ኬክ','ብስኩት'].map(c=>{const x=stock(c,d);return `${c}: መነሻ ${x.opening}, ምርት ${x.produced}, የገባ ${x.incoming}, ሽያጭ ${x.sold}, ተበላሽ ${x.damaged}, ቅርንጫፍ ${x.transfer}, ተመላሽ ${x.returned}, ቀሪ ${x.ending}`}).join('\n');const m=`TOP SUN BAKERY — የቀን መዝጊያ\nቀን: ${d}\nዋና ቤት: ${money(main)}\nቅርንጫፍ: ${money(br)}\nጠቅላላ ሽያጭ: ${money(main+br)}\nወጪ: ${money(ex)}\nCash: ${money(ps.Cash)} | CBE: ${money(ps.CBE)} | Telebirr: ${money(ps.Telebirr)} | ዱቤ: ${money(ps.Credit)}\n\n${st}`;navigator.clipboard?.writeText(m);alert(m+'\n\nCopy ተደርጓል።')}
function reportsPage(){let d=today(),sales=db.sales.filter(x=>x.date===d),exp=db.expenses.filter(x=>x.date===d);let total=sales.reduce((a,x)=>a+x.qty*x.price,0),ex=exp.reduce((a,x)=>a+x.amount,0);document.getElementById('reports').innerHTML=`<div class="card"><div class="sectiontitle">📊 የዛሬ / ወር ሪፖርት</div><label>ወር ምረጥ</label><input id="month" type="month" value="${d.slice(0,7)}" onchange="monthly(this.value)"><div id="monthlyBox"></div></div><div class="card" style="margin-top:10px"><div class="sectiontitle">የዛሬ ትርፍ/ኪሳራ</div><div class="grid"><div>ሽያጭ<div class="kpi">${money(total)}</div></div><div>ወጪ<div class="kpi">${money(ex)}</div></div><div>ቀሪ ከሽያጭ በኋላ<div class="kpi">${money(total-ex)}</div></div></div><div class="muted">ይህ ቀላል የገንዘብ ማጠቃለያ ነው፤ የምርት ኮስት ከተጨመረ የትርፍ ስሌቱ ይጠናከራል።</div></div>`;monthly(d.slice(0,7))}
function monthly(m){
 const cats=['ዳቦ','ኬክ','ብስኩት'];
 const s=db.sales.filter(x=>x.date.startsWith(m)), e=db.expenses.filter(x=>x.date.startsWith(m));
 const total=s.reduce((a,x)=>a+x.qty*x.price,0), ex=e.reduce((a,x)=>a+x.amount,0);
 const rows=cats.map(c=>{
   const sales=s.filter(x=>x.category===c).reduce((a,x)=>a+x.qty*x.price,0);
   const produced=db.production.filter(x=>x.date.startsWith(m)&&x.category===c).reduce((a,x)=>a+(+x.qty||0),0);
   const damaged=db.damaged.filter(x=>x.date.startsWith(m)&&x.category===c).reduce((a,x)=>a+(+x.qty||0),0);
   const direct=e.filter(x=>x.category===c).reduce((a,x)=>a+x.amount,0);
   return `<tr><td><b>${c}</b></td><td>${produced}</td><td>${damaged}</td><td>${money(sales)}</td><td>${money(direct)}</td><td class="total">${money(sales-direct)}</td></tr>`;
 }).join('');
 const shared=e.filter(x=>!cats.includes(x.category)).reduce((a,x)=>a+x.amount,0);
 document.getElementById('monthlyBox').innerHTML=`<div class="grid" style="margin-top:10px"><div>ጠቅላላ ሽያጭ<div class="kpi">${money(total)}</div></div><div>ጠቅላላ ወጪ<div class="kpi">${money(ex)}</div></div><div>ሽያጭ−ወጪ<div class="kpi">${money(total-ex)}</div></div></div><div class="tablewrap" style="margin-top:12px"><table><tr><th>ክፍል</th><th>የተሰራ</th><th>የተበላሸ</th><th>ሽያጭ</th><th>የክፍሉ ወጪ</th><th>ሽያጭ−የክፍሉ ወጪ</th></tr>${rows}</table></div><div class="notice" style="margin-top:10px">ጠቅላላ የጋራ ወጪ፦ <b>${money(shared)}</b> — እንደ ኤሌክትሪክ፣ ኪራይ፣ ደመወዝ ያሉ ወጪዎችን “ጠቅላላ ወጪ” በማለት መመዝገብ ይችላሉ።</div><p class="muted">ማስታወሻ፦ የዳቦ/ኬክ/ብስኩት ትርፍ እዚህ የሚታየው ከተመዘገበው የዚያ ክፍል ወጪ በኋላ ነው፤ የጥሬ ዕቃ ኮስት በክፍል ሲመዘገብ ሪፖርቱ የበለጠ ትክክለኛ ይሆናል።</p>`;
}
function usersPage(){document.getElementById('users').innerHTML=`<div class="card"><div class="sectiontitle">👥 ተጠቃሚዎች እና Permission</div><div class="notice">አሁን ያለው ስሪት የRole/Permission ፕሮቶታይፕ ነው። ከላይ ያለውን “የገባ ተጠቃሚ” በመቀየር የሚታዩትን ክፍሎች መሞከር ይችላሉ።</div><div class="tablewrap"><table><tr><th>Role</th><th>ፈቃድ ያላቸው ክፍሎች</th></tr>${Object.entries(rolePerms).map(([r,ps])=>`<tr><td><b>${r}</b></td><td>${ps.map(x=>({dash:'ዳሽቦርድ',main:'ዋና ቤት',branch:'ቅርንጫፍ',production:'ምርት/ስቶክ',sales:'ሽያጭ',expenses:'ወጪ',borrow:'ብድር/እቃ',closing:'የቀን መዝጊያ',reports:'ሪፖርት',users:'ተጠቃሚዎች'}[x])).join(' • ')}</td></tr>`).join('')}</table></div><div class="notice"><b>Owner</b> ብቻ የተጠቃሚዎችን ክፍል ያያል። በእውነተኛ የLogin/Password ስርዓት ለመጨመር ቀጣይ ደረጃ የServer መረጃ ቋት ያስፈልጋል።</div></div>`}

function isClosed(date){return db.closed.some(x=>x.date===date)}
function closeDay(){document.querySelector('[data-tab=\"closing\"]').click();closingPage(today())}
function delItem(type,i){let x=db[type][i];if(x&&x.date&&isClosed(x.date)){alert('ይህ ቀን ተዘግቷል፤ መረጃውን መሰረዝ አይቻልም።');return}if(confirm('ሰርዝ?')){db[type].splice(i,1);save()}}
applyPermissions();
function renderAll(){dash();mainPage();productionPage();salesPage();expensesPage();branchPage();borrowPage();closingPage();reportsPage();usersPage()}renderAll(); restoreSession();
</script></body></html>
